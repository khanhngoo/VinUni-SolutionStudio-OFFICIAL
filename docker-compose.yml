services:
  db:
    image: pgvector/pgvector:pg18
    container_name: vinuni-solution-studio-db

    environment:
      POSTGRES_USER: vinuni
      POSTGRES_PASSWORD: vinuni_dev
      POSTGRES_DB: solution_studio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U vinuni -d solution_studio"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: