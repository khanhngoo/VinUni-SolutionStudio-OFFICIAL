services:
  db:
    image: pgvector/pgvector:pg18
    container_name: vinuni-solution-studio-db

    environment:
      POSTGRES_USER: vinuni
      POSTGRES_PASSWORD: vinuni_dev
      POSTGRES_DB: solution_studio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U vinuni -d solution_studio"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 6.5 — local containerized development only. Behind an explicit
  # profile so bare `docker compose up -d` (used by `pnpm db:up` and
  # `pnpm db:reset`) continues to start only `db`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinuni-solution-studio-app
    profiles:
      - app

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env
    environment:
      # Overrides the host-form DATABASE_URL from .env so the containerized
      # app reaches the db service by its Compose network hostname.
      DATABASE_URL: postgresql://vinuni:vinuni_dev@db:5432/solution_studio

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  postgres_data:
  app_node_modules: